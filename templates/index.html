<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOST系统控制台</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #4facfe 100%);
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            width: 90%;
            max-width: 750px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 36px;
            margin-bottom: 35px;
            background: linear-gradient(135deg, #1e3c72 0%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }

        .button-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 18px;
            margin-bottom: 35px;
        }

        .button {
            display: block;
            padding: 18px 24px;
            font-size: 18px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.3);
            font-weight: 600;
            border: none;
        }

        .button:hover {
            background: linear-gradient(135deg, #3a8de8 0%, #00d9fe 100%);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(79, 172, 254, 0.4);
        }

        .input-group {
            margin-top: 30px;
            text-align: left;
        }

        label {
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
            display: block;
            margin-bottom: 10px;
        }

        select, input {
            width: 100%;
            padding: 14px 18px;
            margin-top: 8px;
            border: 2px solid #e0e7ff;
            border-radius: 10px;
            font-size: 16px;
            background: #f8faff;
            color: #2c3e50;
            transition: all 0.3s ease;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #4facfe;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
        }

        button {
            width: 100%;
            padding: 16px;
            margin-top: 15px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(30, 60, 114, 0.3);
        }

        button:hover {
            background: linear-gradient(135deg, #2a5298 0%, #3d6bb3 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(30, 60, 114, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        pre {
            background: linear-gradient(135deg, #f0f7ff 0%, #e8f4ff 100%);
            padding: 20px;
            border-radius: 10px;
            max-height: 300px;
            overflow-y: auto;
            font-size: 16px;
            text-align: left;
            border: 2px solid #d0e7ff;
            color: #2c3e50;
            line-height: 1.6;
            font-family: 'Courier New', monospace;
        }

        pre::-webkit-scrollbar {
            width: 8px;
        }

        pre::-webkit-scrollbar-track {
            background: #e8f4ff;
            border-radius: 4px;
        }

        pre::-webkit-scrollbar-thumb {
            background: #4facfe;
            border-radius: 4px;
        }

        pre::-webkit-scrollbar-thumb:hover {
            background: #3a8de8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SOST系统控制台</h1>
        <div class="button-group">
            <a href="{{ url_for('stability_status') }}" class="button">测试状态</a>
            <a href="{{ url_for('stability_download_log') }}" class="button">下载日志</a>
            <a href="{{ url_for('return_history') }}" class="button">测试历史</a>
            <a href="{{ url_for('return_sost_tmp') }}" class="button">SOST缓存</a>
            <a href="{{ url_for('return_get_data') }}" class="button">JSON数据</a>
        </div>
        
        <div class="input-group">
            <label for="test-type">选择测试类型：</label>
            <select id="test-type">
                <option value="reboot">Reboot</option>
                <option value="powercycle">PowerCycle</option>
                <option value="powerreset">PowerReset</option>
                <option value="aclost">Aclost</option>
            </select>
            <button onclick="startTest()">开始测试</button>
        </div>

        <div class="input-group">
            <label for="command-input">输入命令：</label>
            <input type="text" id="command-input" placeholder="请输入命令" required>
            <button onclick="executeCommand()">执行</button>
        </div>
        <pre id="output"></pre>
    </div>

    <script>
        function startTest() {
            const testType = document.getElementById('test-type').value;
            const url = `/run?type=${testType}`;
            fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`SOST正在进行稳定性测试!`);
                    }
                    return response.text(); // 改为接收文本
                })
                .then(text => alert("SOST开始进行稳定性测试!"))
                .catch(error => alert("SOST正在进行稳定性测试!"));
        }
        function executeCommand() {
            const command = document.getElementById('command-input').value;
            fetch('/execute_command', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ command })
            })
            .then(response => response.json())
            .then(data => document.getElementById('output').textContent = data.output)
            .catch(error => document.getElementById('output').textContent = '执行命令时出错');
        }
    </script>
</body>
</html>
